[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Celo networks (fill RPCs / keys in .env before deploying)
[rpc_endpoints]
celo = "${CELO_RPC_URL}"                  # Mainnet — chainId 42220 (Proof of Ship counts here)
celo_sepolia = "${CELO_SEPOLIA_RPC_URL}"  # Testnet — chainId 11142220 (QA only)

# Verification via Etherscan V2 unified API (single key, chainid param).
[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", chain = 42220, url = "https://api.etherscan.io/v2/api?chainid=42220" }
celo_sepolia = { key = "${CELOSCAN_API_KEY}", chain = 11142220, url = "https://api.etherscan.io/v2/api?chainid=11142220" }
